name: APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK fordítása
        working-directory: Arfolyam
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Közzététel letölthető kiadásként
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Arfolyam/app/build/outputs/apk/release/app-release.apk Arfolyam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Arfolyam.apk \
            --target "${{ github.sha }}" \
            --title "Árfolyam app – legfrissebb" \
            --notes "Telepítéshez töltsd le az Arfolyam.apk fájlt a telefonon."
